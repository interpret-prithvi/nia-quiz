<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Round – NIA Quiz</title>
  <link rel="icon" type="image/png" href="../nia.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/visual-round.css" />
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="../index.html" class="back-btn">← Dashboard</a>
      <span class="topbar-divider">|</span>
      <span class="topbar-title">Visual Round &nbsp;–&nbsp; <span id="qLabel">Q1 / 8</span></span>
    </div>
    <div class="topbar-right">
      <a href="scoreboard.html" class="btn-scoreboard" target="_blank">📊 Show Leaderboard</a>
    </div>
  </header>

  <div class="page-body">

    <!-- ════════════════════════════════
         LEFT: QUESTION NAVIGATOR
    ════════════════════════════════ -->
    <aside class="nav-panel">
      <div class="nav-panel-title">Questions</div>
      <div class="q-grid" id="qGrid">
        <!-- 8 buttons injected by JS -->
      </div>
      <div class="nav-legend">
        <span class="legend-dot done"></span> Done
        <span class="legend-dot pending"></span> Pending
        <span class="legend-dot active"></span> Current
      </div>
    </aside>

    <!-- ════════════════════════════════
         CENTER: VISUAL QUESTION DISPLAY
    ════════════════════════════════ -->
    <main class="question-panel">
      <div class="question-card">

        <div class="question-meta">
          <span class="q-number" id="qNumber">Question 1</span>
          <span class="round-badge">Visual Round</span>
        </div>

        <!-- Question Image -->
        <div class="visual-img-wrap" id="questionImgWrap">
          <img
            id="questionImg"
            src=""
            alt="Visual Question"
            class="visual-img"
          />
        </div>

        <!-- Answer Image — hidden until button clicked -->
        <div class="answer-box" id="answerBox" style="display:none;">
          <span class="answer-label">उत्तर / Answer</span>
          <div class="visual-img-wrap answer-img-wrap">
            <img
              id="answerImg"
              src=""
              alt="Visual Answer"
              class="visual-img"
            />
          </div>
        </div>

        <button class="btn-show-answer" id="showAnsBtn" type="button">👁 Show Answer</button>
      </div>

      <div class="question-nav-btns">
        <button class="btn-nav" id="prevBtn">← Prev</button>
        <button class="btn-nav btn-nav-next" id="nextBtn">Next →</button>
      </div>
    </main>

    <!-- ════════════════════════════════
         RIGHT: SCORE ENTRY
    ════════════════════════════════ -->
    <aside class="score-panel">
      <div class="score-panel-title">Score Entry</div>
      <div class="schools-list" id="schoolsList">
        <!-- Injected by JS -->
      </div>
    </aside>

  </div>

  <script src="../js/visualRound.js"></script>
</body>
</html>
